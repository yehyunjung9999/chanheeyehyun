<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보장지도 매니저 목업</title>
<meta name="description" content="직업계고 최소 성취수준 보장지도 매니저 화면 목업(예시 데이터)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* Layout: left rail (navigation grouped by Part A / Part B) + work area; phone frame for the journal screen */
  :root {
    --bg: #F3F5F8; --surface: #FFFFFF; --surface-2: #F8FAFC; --ink: #18202C; --muted: #5E6979; --line: #DDE2EA;
    --brand: #1F4E8C; --brand-soft: #E6EEF8;
    --a: #2F5BD3; --a-soft: #E3EBFF; --b: #C2621A; --b-soft: #FFEBD9;
    --danger: #C0392B; --danger-soft: #FDE7E4; --caution: #A86A12; --caution-soft: #FDF2DA; --ok: #2E7D4F; --ok-soft: #E2F3E8;
    --shadow: 0 1px 2px rgba(20,30,50,.06), 0 4px 16px rgba(20,30,50,.06);
    --font: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11151B; --surface: #1A2029; --surface-2: #151A22; --ink: #E6EBF2; --muted: #9AA5B5; --line: #2C3542;
      --brand: #8FB4EA; --brand-soft: #1C2A40;
      --a: #8FB0FF; --a-soft: #1F2C4D; --b: #F2A766; --b-soft: #3A2716;
      --danger: #FF8A7D; --danger-soft: #3D1A16; --caution: #F2C066; --caution-soft: #3A2C12; --ok: #7FD3A0; --ok-soft: #173325;
      --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
  .sno { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .mock-banner { background: var(--brand); color: #fff; font-size: 13px; padding: 7px max(16px, env(safe-area-inset-left, 0px)); text-align: center; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mock-banner { color: #10161f; } }

  .app { display: grid; grid-template-columns: 236px 1fr; min-height: calc(100vh - 34px); }
  .side { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: calc(100vh - 34px); overflow-y: auto; }
  .logo { display: grid; gap: 2px; padding: 0 8px; }
  .logo b { font-size: 17px; letter-spacing: -0.01em; }
  .logo span { color: var(--muted); font-size: 12.5px; }
  .navgroup { display: grid; gap: 2px; }
  .navgroup h4 { margin: 6px 8px 4px; font-size: 11.5px; letter-spacing: .06em; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .navitem { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; font-size: 14.5px; }
  .navitem:hover { background: var(--surface-2); }
  .navitem.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .navitem[disabled] { color: var(--muted); cursor: default; opacity: .7; }
  .navitem .tag { margin-left: auto; font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 6px; }
  .tag.A { background: var(--a-soft); color: var(--a); } .tag.B { background: var(--b-soft); color: var(--b); } .tag.Z { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .hideparts .navitem .tag, .hideparts .navgroup h4 .tag { display: none; }
  .side-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 8px; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding: 18px max(20px, env(safe-area-inset-right, 0px)) 10px max(20px, env(safe-area-inset-left, 0px)); }
  .crumb { font-size: 12.5px; color: var(--muted); }
  h1 { margin: 2px 0 0; font-size: 24px; letter-spacing: -0.015em; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ctl { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  select, input[type=text], input[type=number], input[type=date], textarea {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-height: 38px;
  }
  textarea { width: 100%; resize: vertical; min-height: 84px; }
  .toggle { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 999px; font-size: 13.5px; min-height: 38px; }
  .toggle.on { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .part-note { margin: 0 max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px)); font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .part-note[hidden] { display: none !important; }
  .pill { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .pill.A { background: var(--a-soft); color: var(--a); } .pill.B { background: var(--b-soft); color: var(--b); } .pill.Z { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }

  .view { padding: 14px max(20px, env(safe-area-inset-right, 0px)) 28px max(20px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; align-content: start; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
  .card h2 { margin: 0; font-size: 16px; }
  .card .sub { color: var(--muted); font-size: 13.5px; margin: -6px 0 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
  .kpi .label { font-size: 13px; color: var(--muted); }
  .kpi .value { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1.1; }
  .kpi .value small { font-size: 15px; color: var(--muted); font-weight: 500; }
  .kpi.danger { border-left: 4px solid var(--danger); } .kpi.ok { border-left: 4px solid var(--ok); } .kpi.warn { border-left: 4px solid var(--caution); } .kpi.info { border-left: 4px solid var(--brand); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--surface); }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; white-space: nowrap; }
  th { font-size: 12.5px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
  tr:last-child td { border-bottom: 0; }
  td.wrap { white-space: normal; min-width: 220px; }
  tr.clickable { cursor: pointer; } tr.clickable:hover td { background: var(--surface-2); }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .badge.danger { background: var(--danger-soft); color: var(--danger); }
  .badge.caution { background: var(--caution-soft); color: var(--caution); }
  .badge.normal, .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
  .badge.info { background: var(--brand-soft); color: var(--brand); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .hint { font-size: 12.5px; color: var(--muted); }
  .warnlist { margin: 4px 0 0; padding-left: 16px; font-size: 12.5px; color: var(--danger); white-space: normal; }
  .warnlist li.soft { color: var(--caution); }

  .btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; font-size: 14px; min-height: 38px; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #10161f; } }
  .btn.small { padding: 4px 10px; min-height: 30px; font-size: 13px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .spacer { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; min-height: 36px; }
  .chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab { border: 0; background: transparent; padding: 8px 12px; border-bottom: 2px solid transparent; font-size: 14px; color: var(--muted); }
  .tab.on { color: var(--ink); border-bottom-color: var(--brand); font-weight: 600; }

  /* hours bar */
  .hbar { position: relative; height: 18px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; display: flex; overflow: hidden; min-width: 180px; }
  .hbar span { height: 100%; }
  .hbar .d { background: var(--b); } .hbar .p { background: var(--a); } .hbar .e { background: var(--ok); }
  .hbar .need { position: absolute; top: -3px; bottom: -3px; border-left: 2px dashed var(--danger); }
  .hlegend { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
  .hlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  /* drawer */
  .layout-drawer { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  @media (max-width: 1080px) { .layout-drawer { grid-template-columns: 1fr; } }

  /* phone */
  .journal-wrap { display: grid; grid-template-columns: 410px minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 980px) { .journal-wrap { grid-template-columns: 1fr; } }
  .phone { width: 410px; max-width: 100%; background: var(--surface); border: 10px solid #232a35; border-radius: 34px; padding: 18px 16px 20px; display: grid; gap: 14px; box-shadow: var(--shadow); }
  @media (max-width: 600px) { .phone { border: 1px solid var(--line); border-radius: 12px; width: 100%; } }
  .phone .ph-head { display: flex; justify-content: space-between; align-items: baseline; }
  .phone .ph-head b { font-size: 17px; }
  .field { display: grid; gap: 6px; }
  .field > label, .field > .lab { font-size: 12.5px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; }
  .stepper .num { font-size: 20px; min-width: 48px; text-align: center; font-weight: 600; }
  .att { display: grid; gap: 6px; }
  .att button { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--surface); min-height: 44px; }
  .att .st { font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 999px; }
  .st.present { background: var(--ok-soft); color: var(--ok); } .st.late { background: var(--caution-soft); color: var(--caution); } .st.absent { background: var(--danger-soft); color: var(--danger); }
  .save { width: 100%; min-height: 48px; font-size: 16px; }

  /* A4 preview */
  .a4 { background: #fff; color: #111; border: 1px solid var(--line); border-radius: 6px; padding: 28px 30px; max-width: 820px; box-shadow: var(--shadow); }
  .a4 h3 { text-align: center; margin: 0 0 12px; font-size: 19px; }
  .a4 table { background: #fff; color: #111; font-size: 13px; }
  .a4 th, .a4 td { border: 1px solid #333; padding: 6px 8px; text-align: center; color: #111; background: #fff; }
  .a4 th { background: #eef2f6; }
  .a4 .meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
  .a4 .note { font-size: 12px; margin-top: 8px; }

  .report-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .rcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; display: grid; gap: 4px; }
  .rcard.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
  .rcard b { font-size: 15px; } .rcard span { font-size: 13px; color: var(--muted); }

  .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .setting { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 6px; background: var(--surface); }
  .setting label { font-weight: 600; font-size: 14px; }
  .setting input { width: 120px; }
  .check-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .check-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .check-list .ok { color: var(--ok); font-weight: 700; }

  .worksheet { border: 1px solid var(--line); border-radius: 10px; padding: 18px; background: var(--surface-2); display: grid; gap: 10px; font-size: 14.5px; }
  .worksheet h3 { margin: 0; font-size: 17px; }
  .worksheet ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
  .meter { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--brand); }
  .dropzone { border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted); background: var(--surface-2); }
  .steps { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13.5px; }
  .steps span { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
  .steps span.on { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); font-weight: 600; }
  tr.err td { background: var(--danger-soft); }

  .foot { margin-top: auto; padding: 14px max(20px, env(safe-area-inset-right, 0px)) 22px max(20px, env(safe-area-inset-left, 0px)); font-size: 12.5px; color: var(--muted); display: flex; gap: 6px 16px; flex-wrap: wrap; border-top: 1px solid var(--line); }
  .foot button { border: 0; background: none; color: var(--brand); padding: 0; text-decoration: underline; font-size: 12.5px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); z-index: 20; max-width: calc(100% - 32px); }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 10px 12px; gap: 6px; border-right: 0; border-bottom: 1px solid var(--line); }
    .logo, .side-foot, .navgroup h4 { display: none; }
    .navgroup { display: flex; gap: 4px; }
    .navitem { white-space: nowrap; width: auto; }
    .navitem[disabled] { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* 주석 달기 */
  :root { --pin: #D63A73; --pin-soft: #FCE4EE; }
  .annotating #app, .annotating #app * { cursor: crosshair !important; }
  .anno-hover { outline: 2px dashed var(--pin) !important; outline-offset: 2px; }
  #annoBtn.on { background: var(--pin-soft); border-color: var(--pin); color: var(--pin); font-weight: 600; }
  #annoLayer { position: absolute; top: 0; left: 0; width: 0; height: 0; z-index: 15; }
  .anno-pin { position: absolute; min-width: 24px; height: 24px; border-radius: 12px; background: var(--pin); color: #fff; font: 600 12px/20px var(--mono); text-align: center; padding: 0 6px; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); cursor: pointer; }
  .anno-pop { position: fixed; z-index: 30; width: min(340px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.22); padding: 14px; display: grid; gap: 10px; }
  .anno-panel { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(56px + env(safe-area-inset-top, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 24px)); z-index: 25; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.2); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
  .anno-panel > header, .anno-panel > footer { padding: 12px 14px; display: grid; gap: 8px; }
  .anno-panel > header { border-bottom: 1px solid var(--line); }
  .anno-panel > footer { border-top: 1px solid var(--line); }
  .anno-list { overflow-y: auto; padding: 10px 14px; display: grid; gap: 10px; align-content: start; }
  .anno-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 6px; font-size: 13.5px; }
  .anno-item.focus { border-color: var(--pin); box-shadow: 0 0 0 2px var(--pin-soft); }
  .anno-item .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
  .anno-num { background: var(--pin); color: #fff; border-radius: 999px; padding: 0 7px; font-family: var(--mono); font-size: 12px; }
  .anno-hint { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 26; background: var(--pin); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13.5px; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
  #annoCopyBox { width: 100%; min-height: 70px; font-size: 12px; }
</style>
</head>
<body>
<div class="mock-banner">목업 · 예시 데이터입니다(실제 학생 아님). 예시 시점은 2026년 7월 24일, 1학기 보충지도 기간이에요. 저장·출력 버튼 일부는 동작을 흉내만 냅니다.</div>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="메뉴"></aside>
  <main class="main">
    <header class="topbar">
      <div>
        <div class="crumb" id="crumb"></div>
        <h1 id="pageTitle"></h1>
      </div>
      <div class="controls">
        <label class="ctl" for="roleSel">보기
          <select id="roleSel">
            <option value="admin">담당자</option>
            <option value="teacher">교과 교사(국어)</option>
          </select>
        </label>
        <button class="toggle" id="rosterBtn" aria-pressed="false">명렬표 불러오기</button>
        <button class="toggle on" id="partBtn" aria-pressed="true">파트 표시 켜짐</button>
        <button class="toggle" id="annoBtn" aria-pressed="false">✎ 주석 달기</button>
        <button class="toggle" id="annoListBtn">주석 목록 0</button>
      </div>
    </header>
    <div class="part-note" id="partNote"></div>
    <div class="view" id="view"></div>
    <footer class="foot">
      <button data-act="go" data-arg="privacy">개인정보처리방침</button>
      <span>이용약관</span>
      <span>문의: bojang-help@school.example</span>
      <span>보장지도 매니저 · 충남교육청 2026 학업성적관리 시행지침 기준</span>
    </footer>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="annoLayer"></div>
<div class="anno-hint" id="annoHint" hidden>주석 모드예요. 의견을 남길 곳을 누르세요. 메뉴로 화면을 옮길 수 있어요. 끝내려면 Esc</div>
<div class="anno-pop" id="annoPop" role="dialog" aria-label="주석 쓰기" hidden></div>
<aside class="anno-panel" id="annoPanel" aria-label="주석 목록" hidden>
  <header>

  V.privacy = () => {
    const A = [['제2조 수집 항목', '교사: 이메일, 표시 이름. 학생: 학번(가명), 성적, 결과 횟수, 보장지도 기록, 특별 처리 구분. 학생 이름·연락처·민감정보는 수집하지 않아요.'], ['제3조 목적', '최소 성취수준 보장지도 대상 선정, 지도 기록, 이수 판정, 학교 보고'], ['제4조 보유·파기', '학년도 종료 후 백업을 내보내고 정해진 기간 안에 삭제(기간은 확정 예정)'], ['제5조 제3자 제공', '제공하지 않아요'], ['제6조 위탁', 'Supabase(서울 리전), Vercel(서울 함수 리전), Anthropic(활동지 생성, 개인정보 전송 없음)'], ['제7조 권리', '열람·정정·삭제·처리정지 요청 방법과 연락처'], ['제8조 만 14세 미만', '이용자는 교사로 한정, 학생 식별정보는 교사 기기에만'], ['제9조 안전조치', 'HTTPS, RLS 접근통제, 교사 승인제, 보안 헤더, 비밀키 서버 보관'], ['제10조 보호책임자', '이름·연락처(확정 예정), 분쟁조정·침해신고 안내']];
    return '<div class="card"><h2>개인정보처리방침(요약 · 목업)</h2><div class="table-wrap"><table><tbody>' + A.map(([a, b]) => '<tr><th style="width:150px">' + a + '</th><td class="wrap">' + b + '</td></tr>').join('') + '</tbody></table></div><p class="hint">dorms-check의 개인정보처리방침 양식을 골격으로, 에듀집 9개 항목에 맞춰 채워요.</p></div>';
  };

  // ── 동작 ──
  function render() { renderSide(); renderHead(); $('#view').innerHTML = V[S.view](); if (window.__afterRender) window.__afterRender(); }
  window.__mock = { view: () => S.view, title: id => PAGES[id || S.view].title, go: id => { S.view = id; render(); window.scrollTo(0, 0); }, role: () => (S.role === 'admin' ? '담당자' : '교과 교사'), toast: m => toast(m) };
  const ACT = {
    go: id => { S.view = id; render(); window.scrollTo(0, 0); },
    toast: msg => toast(msg),
    riskLevel: l => { S.riskLevel = l; render(); },
    diag: key => { S.drawer = key; render(); },
    closeDiag: () => { S.drawer = null; render(); },
    diagStd: i => { const d = S.diag[S.drawer]; const n = +i; d.std = d.std.includes(n) ? d.std.filter(x => x !== n) : d.std.concat(n); render(); },
    ttab: k => { S.targetTab = k; render(); },
    check: id => { const t = TARGETS.find(x => x.id === id); t.status = 'checked'; toast('교과 확인했어요. 담당자가 확정하면 지도 대상이 돼요.'); render(); },
    confirm: id => { if (!isAdmin()) return; const t = TARGETS.find(x => x.id === id); t.status = 'confirmed'; toast('확정했어요. 이제 운영 일지와 진행 현황에 나타나요.'); render(); },
    genAI: () => { S.aiShown = true; toast('초안을 만들었어요. 검토 후 사용해 주세요.'); render(); },
    jKind: k => { S.journal.kind = k; S.journal.att = {}; render(); },
    jMethod: m => { S.journal.method = m; render(); },
    jPeriod: p => { S.journal.period = p; render(); },
    jHours: d => { S.journal.hours = Math.min(8, Math.max(0.5, S.journal.hours + parseFloat(d))); render(); },
    jAtt: no => { const order = ['present', 'late', 'absent']; const a = S.journal.att; a[no] = order[(order.indexOf(a[no]) + 1) % 3]; render(); },
    jLoadLast: () => { const J = S.journal; const last = SESSIONS.filter(s => s.subj === J.subj).sort((a, b) => b.date.localeCompare(a.date))[0]; if (last) { J.content = last.content; J.method = last.method; J.kind = last.kind === 'prevention' || last.kind === 'remedial' || last.kind === 'attendance' ? last.kind : J.kind; } toast('지난 차시 내용을 불러왔어요. 날짜만 오늘로 바뀌어요.'); render(); },
    jSnip: s => { const J = S.journal; J.content = (J.content ? J.content + ', ' : '') + s; render(); },
    jSave: () => {
      const J = S.journal; const students = journalStudents(J); if (!students.length) { toast('출석할 대상 학생이 없어요.'); return; }
      const att = {}; students.forEach(no => { att[no] = J.att[no] || 'present'; });
      SESSIONS.push({ id: 'n' + Date.now(), subj: J.kind === 'emotional_common' ? null : J.subj, kind: J.kind, method: J.kind === 'emotional_common' ? 'emotional' : J.method, date: '2026-07-24', period: J.period, hours: J.hours, content: J.content || '(내용 없음)', att });
      S.journal = null; toast('일지를 저장했어요. 시수와 경고가 다시 계산됐어요.'); render();
    },
    warnOnly: () => { S.warnOnly = !S.warnOnly; render(); },
    confirmAll: () => { if (!isAdmin()) return; let n = 0; confirmed().forEach(t => { if (!RESULT[t.id] && progress(t).completable) { RESULT[t.id] = 'passed'; n++; } }); toast(n + '명을 이수로 확정했어요(학관위 ' + S.committeeDate + ').'); render(); },
    report: k => { S.report = k; render(); }
  };
  const CHG = {
    riskSubj: (a, el) => { S.riskSubj = el.value; render(); },
    diagCause: (k, el) => { const d = S.diag[S.drawer]; d.causes = el.checked ? d.causes.concat(k) : d.causes.filter(x => x !== k); },
    diagMemo: (a, el) => { S.diag[S.drawer].memo = el.value; },
    exclude: (id, el) => { if (!el.value) return; const t = TARGETS.find(x => x.id === id); t.status = 'excluded'; t.excluded = el.value; toast('제외했어요. 사유: ' + el.value); render(); },
    consent: (id, el) => { TARGETS.find(x => x.id === id).consent = el.checked; },
    jSubj: (a, el) => { S.journal.subj = el.value; S.journal.att = {}; render(); },
    jContent: (a, el) => { S.journal.content = el.value; },
    reach: (id, el) => { REACH[id] = el.value || null; render(); },
    cdate: (a, el) => { S.committeeDate = el.value; },
    set: (k, el) => { const v = parseFloat(el.value); if (!isNaN(v)) { SET[k] = v; toast('기준값을 바꿨어요. 다른 화면에 바로 반영돼요.'); } },
    setBool: (k, el) => { SET[k] = el.checked; toast('설정을 바꿨어요.'); }
  };
  document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a || a.disabled) return; if (a.closest('tr.clickable') && a.tagName === 'TR' && e.target.closest('button,select,input')) return; e.stopPropagation(); ACT[a.dataset.act] && ACT[a.dataset.act](a.dataset.arg, a, e); });
  document.addEventListener('change', e => { const a = e.target.closest('[data-chg]'); if (a && CHG[a.dataset.chg]) CHG[a.dataset.chg](a.dataset.arg, a, e); });
  document.addEventListener('input', e => { const a = e.target.closest('[data-chg="jContent"],[data-chg="diagMemo"]'); if (a) CHG[a.dataset.chg](a.dataset.arg, a, e); });
  $('#roleSel').addEventListener('change', e => { S.role = e.target.value; if (PAGES[S.view].admin && !isAdmin()) S.view = 'dashboard'; render(); });
  $('#rosterBtn').addEventListener('click', e => { S.roster = !S.roster; const b = e.currentTarget; b.classList.toggle('on', S.roster); b.setAttribute('aria-pressed', String(S.roster)); b.textContent = S.roster ? '명렬표 불러옴(이 컴퓨터에만)' : '명렬표 불러오기'; toast(S.roster ? '이름은 이 컴퓨터에만 저장돼요. 서버로 보내지 않아요.' : '명렬표를 지웠어요. 학번만 보여요.'); render(); });
  $('#partBtn').addEventListener('click', e => { S.parts = !S.parts; const b = e.currentTarget; b.classList.toggle('on', S.parts); b.setAttribute('aria-pressed', String(S.parts)); b.textContent = S.parts ? '파트 표시 켜짐' : '파트 표시 꺼짐'; render(); });
  render();
})();
</script>
<script>
// 주석 달기: 화면 요소를 눌러 의견을 남기면 이 브라우저(localStorage)에 저장된다. Claude가 이 목록을 직접 읽는다.
(() => {
  const KEY = 'bojang-mockup-notes-v1', AKEY = 'bojang-mockup-author';
  const M = window.__mock;
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let notes = [];
  try { notes = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { notes = []; }
  let author = '선생님 A';
  try { author = localStorage.getItem(AKEY) || author; } catch (e) { /* 저장 불가 환경 */ }
  let on = false, hoverEl = null, pending = null, focusId = null;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) { M.toast('이 브라우저에 저장하지 못했어요. "모두 복사"로 옮겨 주세요.'); } };
  const PICK = 'button, select, input, textarea, label, .kpi, .chip, .rcard, .setting, .badge, .hbar, .phone, .a4, .worksheet, .dropzone, .steps, td, th, h1, h2, p, li, .card';
  const PASS = '#annoPop, #annoPanel, #annoBtn, #annoListBtn, #annoHint, .anno-pin, .navitem, #roleSel, #rosterBtn, #partBtn, .mock-banner';
  const pick = t => (t.closest && t.closest(PICK)) || t;
  const passes = t => !!(t.closest && t.closest(PASS));
  function pathOf(el) { const p = []; while (el && el !== document.body && el.parentElement) { p.unshift([].indexOf.call(el.parentElement.children, el)); el = el.parentElement; } return p; }
  function byPath(p) { let el = document.body; for (const i of p) { el = el && el.children[i]; if (!el) return null; } return el; }
  function describe(el) {
    const kind = { BUTTON: '버튼', TD: '표 칸', TH: '표 제목', H1: '화면 제목', H2: '소제목', SELECT: '선택 상자', INPUT: '입력칸', TEXTAREA: '입력칸', LABEL: '항목', LI: '목록 항목', P: '안내 문장' }[el.tagName]
      || (el.classList.contains('kpi') ? '요약 숫자' : el.classList.contains('card') ? '카드' : el.classList.contains('phone') ? '휴대폰 일지 화면' : el.classList.contains('a4') ? '출력물 미리보기' : '영역');
    const t = (el.getAttribute('aria-label') || el.getAttribute('placeholder') || el.innerText || el.value || '').replace(/\s+/g, ' ').trim();
    return kind + (t ? ' "' + t.slice(0, 60) + (t.length > 60 ? '…' : '') + '"' : '');
  }
  function setMode(v) {
    on = v; document.documentElement.classList.toggle('annotating', on);
    const b = $('#annoBtn'); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); b.textContent = on ? '✎ 주석 모드 끝내기' : '✎ 주석 달기';
    $('#annoHint').hidden = !on;
    if (!on) { clearHover(); closePop(); }
  }
  function clearHover() { if (hoverEl) hoverEl.classList.remove('anno-hover'); hoverEl = null; }
  document.addEventListener('mouseover', e => { if (!on || passes(e.target)) { clearHover(); return; } const el = pick(e.target); if (el === hoverEl) return; clearHover(); hoverEl = el; el.classList.add('anno-hover'); }, true);
  document.addEventListener('mousedown', e => { if (on && !passes(e.target)) e.preventDefault(); }, true);
  document.addEventListener('click', e => { if (!on || passes(e.target)) return; e.preventDefault(); e.stopPropagation(); openPop({ el: pick(e.target), x: e.clientX, y: e.clientY }); }, true);
  document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!$('#annoPop').hidden) closePop(); else if (on) setMode(false); });

  function openPop({ el, x, y, whole }) {
    pending = whole ? { screen: M.view(), path: null, target: '화면 전체' } : { screen: M.view(), path: pathOf(el), target: describe(el) };
    const pop = $('#annoPop');
    pop.innerHTML = '<div class="hint"><b>' + esc(M.title(pending.screen)) + '</b> · ' + esc(pending.target) + '</div>'
      + '<label class="hint" for="annoText">생각과 다른 점, 바라는 점</label>'
      + '<textarea id="annoText" rows="4" placeholder="예: 이 버튼은 담당자에게만 보이면 좋겠어요"></textarea>'
      + '<div class="row"><span class="hint">작성: ' + esc(author) + '</span><span class="spacer"></span><button class="btn small" id="annoCancel">취소</button><button class="btn small primary" id="annoSave">저장</button></div>';
    pop.hidden = false;
    const w = pop.offsetWidth, h = pop.offsetHeight, cx = x == null ? innerWidth / 2 : x, cy = y == null ? 140 : y;
    pop.style.left = Math.min(Math.max(16, cx - w / 2), innerWidth - w - 16) + 'px';
    pop.style.top = (cy + 16 + h > innerHeight ? Math.max(16, cy - h - 16) : cy + 16) + 'px';
    $('#annoText').focus();
    $('#annoCancel').onclick = closePop;
    $('#annoSave').onclick = () => {
      const text = $('#annoText').value.trim(); if (!text) { $('#annoText').focus(); return; }
      notes.push(Object.assign({ id: Date.now(), author, role: M.role(), text, at: new Date().toISOString() }, pending));
      save(); closePop(); draw(); M.toast('주석을 저장했어요. 지금까지 ' + notes.length + '개');
    };
  }
  function closePop() { $('#annoPop').hidden = true; pending = null; }
  function drawPins() {
    const layer = $('#annoLayer'); layer.innerHTML = ''; const cur = M.view();
    notes.forEach((n, i) => {
      if (n.screen !== cur || !n.path) return;
      const el = byPath(n.path); if (!el || !el.getClientRects().length) return;
      const r = el.getBoundingClientRect(); const pin = document.createElement('button');
      pin.className = 'anno-pin'; pin.textContent = String(i + 1); pin.title = n.text; pin.setAttribute('aria-label', (i + 1) + '번 주석');
      pin.style.top = (r.top + scrollY - 10) + 'px'; pin.style.left = (r.left + scrollX - 10) + 'px';
      pin.onclick = ev => { ev.stopPropagation(); openPanel(n.id); };
      layer.appendChild(pin);
    });
  }
  function drawPanel() {
    $('#annoListBtn').textContent = '주석 목록 ' + notes.length;
    const list = $('#annoPanelList');
    if (!notes.length) { list.innerHTML = '<p class="hint">아직 주석이 없어요. "✎ 주석 달기"를 켜고 화면의 아무 곳이나 눌러 보세요.</p>'; return; }
    list.innerHTML = notes.map((n, i) => '<div class="anno-item' + (n.id === focusId ? ' focus' : '') + '" data-id="' + n.id + '"><div class="meta"><span class="anno-num">' + (i + 1) + '</span><span>' + esc(M.title(n.screen)) + '</span><span>· ' + esc(n.author) + '</span><span>· ' + esc(n.role) + ' 보기</span></div>'
      + '<div class="hint">' + esc(n.target) + '</div><div>' + esc(n.text) + '</div>'
      + '<div class="row"><button class="btn small" data-anno-go="' + n.screen + '">이 화면 보기</button><button class="btn small" data-anno-del="' + n.id + '">삭제</button></div></div>').join('');
  }
  function draw() { drawPins(); drawPanel(); }
  function openPanel(id) { focusId = id || null; $('#annoPanel').hidden = false; drawPanel(); if (id) { const it = document.querySelector('.anno-item[data-id="' + id + '"]'); if (it) it.scrollIntoView({ block: 'nearest' }); } }

  $('#annoBtn').addEventListener('click', () => setMode(!on));
  $('#annoListBtn').addEventListener('click', () => { const p = $('#annoPanel'); if (p.hidden) openPanel(); else p.hidden = true; });
  $('#annoClose').addEventListener('click', () => { $('#annoPanel').hidden = true; });
  const authorSel = $('#annoAuthor'); authorSel.value = author;
  authorSel.addEventListener('change', () => { author = authorSel.value; try { localStorage.setItem(AKEY, author); } catch (e) { /* 무시 */ } });
  $('#annoWhole').addEventListener('click', () => openPop({ whole: true }));
  $('#annoPanelList').addEventListener('click', e => {
    const go = e.target.closest('[data-anno-go]'); const del = e.target.closest('[data-anno-del]');
    if (go) { M.go(go.dataset.annoGo); }
    if (del) { const id = +del.dataset.annoDel; notes = notes.filter(n => n.id !== id); save(); draw(); M.toast('주석을 지웠어요.'); }
  });
  $('#annoCopy').addEventListener('click', () => {
    const text = notes.map((n, i) => '[' + (i + 1) + '] ' + M.title(n.screen) + ' / ' + n.target + ' / ' + n.author + ' (' + n.role + ' 보기)\n' + n.text).join('\n\n') || '주석 없음';
    const box = $('#annoCopyBox');
    const fallback = () => { box.hidden = false; box.value = text; box.focus(); box.select(); M.toast('아래 칸의 글을 복사해 주세요(Ctrl+C).'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => M.toast('주석 ' + notes.length + '개를 복사했어요.'), fallback); else fallback();
  });
  addEventListener('resize', drawPins);
  window.__afterRender = draw;
  window.__annotations = () => notes;
  draw();
})();
</script>
